<main>
<div class="back-nav"><a href="index.html">⌂ 首頁</a><a href="javascript:history.back()">← 回上頁</a></div>
<div class="hex-num-label">搜尋</div>
<h2>全文搜尋</h2>
<p>依卦名、爻位、原文、翻譯、案例搜尋，或選擇分類搜尋特定類別。</p>
<div class="search-filter-bar">
<button class="search-filter-btn active" data-cat="all" onclick="setFilter('all')">全部</button>
<button class="search-filter-btn" data-cat="hexagram" onclick="setFilter('hexagram')">卦名</button>
<button class="search-filter-btn" data-cat="line" onclick="setFilter('line')">爻位</button>
<button class="search-filter-btn" data-cat="original" onclick="setFilter('original')">原文</button>
<button class="search-filter-btn" data-cat="translation" onclick="setFilter('translation')">翻譯</button>
<button class="search-filter-btn" data-cat="case" onclick="setFilter('case')">案例</button>
</div>
<div class="search-input-wrap">
<input type="text" id="search-box" placeholder="輸入搜尋關鍵字…" oninput="doSearch(this.value)">
<span id="search-count"></span>
</div>
<div id="search-results" class="search-results"></div>
</main>
<footer><p>© 2026 YiWord.com · <a href="privacy.html">隱私權政策</a> · <a href="terms-of-use.html">使用條款</a></p></footer>
<script src="search_index.json"></script>
<script>
var SEARCH_DATA=null;
var currentFilter='all';
var LOADING=true;
fetch('search_index.json').then(r=>r.json()).then(d=>{SEARCH_DATA=d;LOADING=false;doSearch(document.getElementById('search-box').value);}).catch(e=>{LOADING=false;document.getElementById('search-results').innerHTML='<p class="small">搜尋資料載入失敗。</p>';});
function setFilter(cat){
  currentFilter=cat;
  document.querySelectorAll('.search-filter-btn').forEach(b=>{b.classList.toggle('active',b.dataset.cat===cat);});
  doSearch(document.getElementById('search-box').value);
}
function doSearch(q){
  if(LOADING){document.getElementById('search-results').innerHTML='<p class="small">資料載入中…</p>';return;}
  if(!SEARCH_DATA){document.getElementById('search-results').innerHTML='<p class="small">搜尋資料載入失敗。</p>';return;}
  q=q.trim().toLowerCase();
  var results=[];
  var cats=currentFilter==='all'?['hexagram','line','original','translation','case']:[currentFilter];
  for(var ci=0;ci<cats.length;ci++){
    var cat=cats[ci];var items=SEARCH_DATA[cat]||[];
    var catLabel={hexagram:'卦名',line:'爻位',original:'原文',translation:'翻譯',case:'案例'}[cat];
    for(var i=0;i<items.length;i++){
      var item=items[i];
      if(!q){results.push({cat:catLabel,title:item.title,link:item.link,text:''});continue;}
      var titleLower=item.title.toLowerCase();
      var textLower=(item.text||'').toLowerCase();
      if(titleLower.indexOf(q)>=0||textLower.indexOf(q)>=0){
        var snippet='';
        var pos=textLower.indexOf(q);
        if(pos>=0){
          var start=Math.max(0,pos-20);var end=Math.min(textLower.length,pos+q.length+40);
          snippet=(start>0?'\u2026':'')+item.text.substring(start,end)+(end<textLower.length?'\u2026':'');
        }
        results.push({cat:catLabel,title:item.title,link:item.link,text:snippet});
      }
    }
  }
  if(!q&&currentFilter!=='all'){results=results.slice(0,0);}
  if(!q&&currentFilter==='all'){results=results.slice(0,0);}
  var container=document.getElementById('search-results');
  document.getElementById('search-count').textContent=q?results.length+' 筆結果':'';
  var html='';
  if(!q&&currentFilter==='all'){
    html='<p class="small">請輸入關鍵字開始搜尋，或選擇分類查看。</p>';
  } else if(!q){
    html='<p class="small">請輸入關鍵字搜尋「'+({hexagram:'卦名',line:'爻位',original:'原文',translation:'翻譯',case:'案例'}[currentFilter]||'')+'」分類。</p>';
  } else {
    for(var i=0;i<Math.min(results.length,200);i++){
      var r=results[i];
      html+='<div class="search-result-item"><span class="search-cat-tag">'+r.cat+'</span><a href="'+r.link+'">'+r.title+'</a><p class="search-snippet">'+(r.text||'')+'</p></div>';
    }
    if(results.length>200){html+='<p class="small">顯示前 200 筆，共 '+results.length+' 筆結果。</p>';}
    if(results.length===0){html='<p class="small">找不到符合的結果。</p>';}
  }
  container.innerHTML=html;
}
</script>
</body>
</html>
