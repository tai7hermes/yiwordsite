  const r=document.getElementById('search-results');
  if(!q.trim()){r.innerHTML='';return}

  const matches=HEXAGRAMS.filter(h=>h[1].includes(q)||h[2].toLowerCase().includes(ql)||h[3].toLowerCase().includes(ql)||h[0].toLowerCase().includes(ql));
  r.innerHTML=matches.length?matches.map(h=>`<div class="card"><a href="hexagram/${h[0].toLowerCase()}.html"><span class="hexagram-symbol" style="font-size:1.5rem">${h[4]}</span> <strong>${h[1]}</strong> · ${h[0]} · ${h[3]}</a></div>`).join(''):'<p class="small">未找到結果。</p>';
