<meta charset="UTF-8">

<link rel="stylesheet" href="../style.css">
</head>
<body>
<header><div class="brand"><img src="../brand/yiword-mark-ivory-v1.svg" alt="YiWord" class="brand-logo" width="32" height="32"> YiWord <span>易理 = 處世之道</span></div><div class="lang-switch"><a href="../cn/search.html" class="active">简中</a> <a href="../search.html">繁中</a> <a href="../en/search.html">EN</a></div></header>
<nav><ul><li><a href="../cn/index.html">首页</a></li><li><a href="../cn/introduction.html">易经介绍</a></li><li><a href="../cn/hexagrams.html">六十四卦</a></li><li><a href="../cn/wings.html">易传十翼</a></li><li><a href="../cn/cases.html">案例</a></li><li><a href="../cn/divination.html">占卜</a></li><li><a href="../cn/terms.html">名词索引</a></li><li><a href="../cn/search.html" class="active">搜索</a></li><li><a href="../cn/about.html">关于</a></li></ul></nav>
<main>
<div class="back-nav"><a href="../cn/index.html">⌂ 首页</a><a href="javascript:history.back()">← 回上页</a></div>
<div class="hex-num-label">搜索</div>
<h2>全文搜索</h2>
<p>依卦名、爻位、原文、翻译、案例搜索，或选择分类搜索特定类别。</p>
<div class="search-filter-bar">
<button class="search-filter-btn active" data-cat="all" onclick="setFilter('all')">全部</button>
<button class="search-filter-btn" data-cat="hexagram" onclick="setFilter('hexagram')">卦名</button>
<button class="search-filter-btn" data-cat="line" onclick="setFilter('line')">爻位</button>
<button class="search-filter-btn" data-cat="original" onclick="setFilter('original')">原文</button>
<button class="search-filter-btn" data-cat="translation" onclick="setFilter('translation')">翻译</button>
<button class="search-filter-btn" data-cat="case" onclick="setFilter('case')">案例</button>
</div>
<div class="search-input-wrap">
<input type="text" id="search-box" placeholder="输入搜索关键字…" oninput="doSearch(this.value)">
<span id="search-count"></span>
</div>
<div id="search-results" class="search-results"></div>
</main>
<footer><p>© 2026 YiWord.com · <a href="../privacy.html">隱私權政策</a> · <a href="../terms-of-use.html">使用條款</a></p></footer>
<script>
var SEARCH_DATA=null;
var currentFilter='all';
fetch('search_index.json').then(r=>r.json()).then(d=>{SEARCH_DATA=d;});
function setFilter(cat){
  currentFilter=cat;
  document.querySelectorAll('.search-filter-btn').forEach(b=>{b.classList.toggle('active',b.dataset.cat===cat);});
  var box=document.getElementById('search-box');doSearch(box.value);
}
function doSearch(q){
  if(!SEARCH_DATA)return;
  q=q.trim().toLowerCase();
  var results=[];
  var cats=currentFilter==='all'?['hexagram','line','original','translation','case']:[currentFilter];
  for(var ci=0;ci<cats.length;ci++){
    var cat=cats[ci];var items=SEARCH_DATA[cat]||[];
    var catLabel={hexagram:'卦名',line:'爻位',original:'原文',translation:'翻译',case:'案例'}[cat];
    for(var i=0;i<items.length;i++){
      var item=items[i];
      if(!q){continue;}
      var titleLower=item.title.toLowerCase();
      var textLower=(item.text||'').toLowerCase();
      if(titleLower.indexOf(q)>=0||textLower.indexOf(q)>=0){
        var snippet='';
        var pos=textLower.indexOf(q);
        if(pos>=0){
          var start=Math.max(0,pos-20);var end=Math.min(textLower.length,pos+q.length+40);
          snippet=(start>0?'…':'')+item.text.substring(start,end)+(end<textLower.length?'…':'');
        }
        results.push({cat:catLabel,title:item.title,link:item.link,text:snippet});
      }
    }
  }
  var container=document.getElementById('search-results');
  document.getElementById('search-count').textContent=q?results.length+' 笔结果':'';
  var html='';
  for(var i=0;i<Math.min(results.length,200);i++){
    var r=results[i];
    html+='<div class="search-result-item"><span class="search-cat-tag">'+r.cat+'</span><a href="'+r.link+'">'+r.title+'</a><p class="search-snippet">'+(r.text||'')+'</p></div>';
  }
  if(results.length>200){html+='<p class="small">显示前 200 笔，共 '+results.length+' 笔结果。</p>';}
  container.innerHTML=html;
}
</script>
</body>
</html>
